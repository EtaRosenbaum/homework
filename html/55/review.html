<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/ThymeCafedetails.css">
        <style>
            form {
                margin-top: 25px;
            }

            #text {
                margin-top: 25px;
                line-height: 2.5em;
            }
        </style>

    </head>

    <body>
        <form method="post">
            <label>
                First name:
                <input name="first" minlength="3" maxlength="10" required />
            </label>

            <label>
                Last name:
                <input name="last" minlength="3" maxlength="10" required />
            </label>

            <label>
                Email
                <input name="email" />
            </label>
            </label>

            password: <input type="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                placeholder="enter password" />
            <input type="submit" />
            <label id="text">
                <br>
                Please tell us about your experience at Thyme Cafe:
                <input name="review" required />
            </label>





        </form>
    </body>

</html>
