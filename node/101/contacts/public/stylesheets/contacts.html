<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>Contacts by AJAX</title>
        <style>
            body {
                font-family: Arial;
                padding: 20px;
            }

            .contact {
                border: 1px solid #ccc;
                padding: 10px;
                margin-bottom: 10px;
                border-radius: 6px;
            }
        </style>
    </head>

    <body>

        <h1>Contacts</h1>

        <div id="contacts"></div>

        <script>
            const contactId = null;
            const url = contactId ? `api/contacts/${contactId}` : `api/contacts`;

            async function fetchContacts(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    console.log(data);
                    const container = document.getElementById('contacts');

                    if (!data.length) {
                        container.innerHTML = "<p>No contacts found.</p>";
                        return;
                    }

                    data.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'contact';
                        div.innerHTML = `
                    <strong>${c.first} ${c.last}</strong><br>
                    Phone: ${c.phone}<br>
                    Email: ${c.email}
                `;
                        container.appendChild(div);
                    });
                } catch (error) {
                    console.error('Fetch error:', error);
                }
            }

           fetchContacts(url);

        </script>

    </body>

</html>
